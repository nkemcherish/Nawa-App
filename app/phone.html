<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAWA · Phone preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e8e0;color:#173d32;font-family:system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:22px 12px;gap:16px}header{text-align:center}header strong{font-size:14px}header p{font-size:12px;color:#657366;margin:6px 0}.phone{position:relative;width:min(390px,calc(100vw - 28px));height:844px;min-height:844px;border:8px solid #202722;border-radius:48px;background:#202722;box-shadow:0 25px 65px #173d3228,0 0 0 1px #657366;overflow:hidden}.phone:before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:96px;height:23px;border-radius:30px;background:#202722;z-index:2;pointer-events:none}iframe{border:0;display:block;width:100%;height:100%;border-radius:0;background:#f7f4ec;padding:0}a{color:#173d32;font-size:12px;text-underline-offset:3px}@media(max-height:600px){body{padding:10px;gap:8px}.phone{height:844px;min-height:844px}}
</style>
</head>
<body><header><strong>NAWA · Live phone preview</strong><p>Tap and scroll inside the phone to use the app.</p></header><div class="phone"><iframe src="/" title="NAWA mobile application"></iframe></div><a href="/" target="_blank">Open app without the phone frame ↗</a></body>
</html>
